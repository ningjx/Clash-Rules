mixed-port: 7893
allow-lan: false
ipv6: false
mode: rule
log-level: error

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://dns.cloudflare.com/dns-query
    - tls://8.8.8.8:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    fallback-lazy-query: true
  # 基础例外及原有自定义域名；其他设备和应用例外由客户端按需添加
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "*.localdomain"
    - "*.home.arpa"
    - "*.localhost"
    - "*.example"
    - "*.invalid"
    - "*.test"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "time.*.com"
    - "ntp.*.com"
    - "+.pool.ntp.org"
    - ntp.ntsc.ac.cn
    - "ntp.*.cn"
    - "ntp1.*.cn"
    - "ntp2.*.cn"
    - "ntp3.*.cn"
    - "ntp4.*.cn"
    - "ntp5.*.cn"
    - "ntp6.*.cn"
    - "ntp7.*.cn"
    - "+.music.163.com"
    - "+.y.qq.com"
    - "+.music.migu.cn"
    - "+.services.googleapis.cn"
    - "+.xn--ngstr-lra8j.cn"
    - "+.mijia.tech"
    - "+.mi.com"
    - "+.xiaomi.net"
    - "time.is"

proxies:
{ProxyList}

proxy-groups:
  - name: 默认节点
    type: select
    proxies:
      - 自动回退
      - 最快节点
{ProxiesNames}
      - DIRECT

#  - name: "链式代理"
#    type: relay
#    proxies:
#      - proxy1
#      - proxy2
#      - proxy3

  - name: 未知流量
    type: select
    proxies:
      - DIRECT
      - 默认节点
      - 最快节点
{ProxiesNames}

#自动生成代理BEGIN
  - name: Microsoft
    type: select
    proxies:
      - DIRECT
      - 默认节点
      - 最快节点
{ProxiesNames}
  - name: YouTube
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: Netflix
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: AmazonPrimeVideo
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: Disney
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: Hulu
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: TikTok
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: Google
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: Telegram
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: OpenAI
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
  - name: Claude
    type: select
    proxies:
      - 默认节点
      - 最快节点
{ProxiesNames}
      - DIRECT
#自动生成代理END

  - name: 最快节点
    type: url-test
    url: https://www.gstatic.com/generate_204
    interval: 300
    proxies:
{ProxiesNames}

  - name: 自动回退
    type: fallback
    url: 'http://www.google.com/generate_204'
    interval: 300
    proxies:
      - 负载均衡
{ProxiesNames}

  - name: 负载均衡
    type: load-balance
    url: 'http://www.google.com/generate_204'
    interval: 300
    strategy: round-robin #consistent-hashing
    proxies:
{BalanceProxiesNames}

